name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 33a508bf0ed8cc754255a085b612338c
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PAGES_PROJECT: logbook

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Tworzy projekt Cloudflare Pages przy pierwszym uruchomieniu (kolejne razy – pomija)
      - name: Ensure Pages project exists
        run: |
          if npx wrangler pages project list 2>/dev/null | grep -qw "$PAGES_PROJECT"; then
            echo "Projekt $PAGES_PROJECT już istnieje"
          else
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy
        id: deploy
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          npx wrangler pages deploy dist --project-name="$PAGES_PROJECT" --branch="$BRANCH" --commit-dirty=true | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Wdrożono: $URL" >> "$GITHUB_STEP_SUMMARY"
